# Private QA fixture; never use as the public production server configuration.
resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server {
  listen 8080;
  server_name _;
  location = /healthz { access_log off; return 200 'ok'; }
  location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nAllow: /owned-qa/\nDisallow: /\n'; }
  location /owned-qa/ { alias /usr/share/nginx/owned-qa/; }
  location / { return 308 https://$host$request_uri; }
}
server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  server_tokens off;
  client_max_body_size 25m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  location /api/v1/ {
    limit_req zone=api_limit burst=40 nodelay;
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
  location / {
    set $web_upstream web:3000;
    proxy_pass http://$web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
