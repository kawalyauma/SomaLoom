<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="Rectangle ABCD with opposite sides of 12 centimetres and 5 centimetres, perimeter 34 centimetres; square EFGH with each side 6 centimetres, perimeter 24 centimetres."><rect width="900" height="510" fill="white"/><g font-family="Arial, sans-serif" fill="#1d2935"><text x="450" y="36" font-size="25" font-weight="bold" text-anchor="middle">PERIMETER: DISTANCE AROUND A SHAPE</text><text x="240" y="83" text-anchor="middle" font-size="21" font-weight="bold">RECTANGLE ABCD</text><rect x="93" y="157" width="310" height="145" fill="#f7fafc" stroke="#263443" stroke-width="3"/><text x="78" y="150" font-size="22">A</text><text x="408" y="150" font-size="22">B</text><text x="408" y="327" font-size="22">C</text><text x="77" y="327" font-size="22">D</text><text x="248" y="140" font-size="19" text-anchor="middle">12 cm</text><text x="248" y="327" font-size="19" text-anchor="middle">12 cm</text><text x="68" y="234" font-size="19" text-anchor="middle" transform="rotate(-90 68 234)">5 cm</text><text x="436" y="234" font-size="19" text-anchor="middle" transform="rotate(90 436 234)">5 cm</text><path d="M205 117 H286 M275 110 L286 117 L275 124 M449 190 V255 M442 245 L449 255 L456 245 M291 344 H209 M220 337 L209 344 L220 351 M49 263 V200 M42 210 L49 200 L56 210" stroke="#405569" stroke-width="2" fill="none"/><text x="248" y="380" font-size="18" text-anchor="middle">P = 12 + 5 + 12 + 5</text><text x="248" y="409" font-size="23" font-weight="bold" text-anchor="middle">P = 34 cm</text><text x="669" y="83" text-anchor="middle" font-size="21" font-weight="bold">SQUARE EFGH</text><rect x="576" y="157" width="185" height="185" fill="#f7fafc" stroke="#263443" stroke-width="3"/><text x="559" y="150" font-size="22">E</text><text x="767" y="150" font-size="22">F</text><text x="768" y="363" font-size="22">G</text><text x="559" y="363" font-size="22">H</text><text x="668" y="140" font-size="19"