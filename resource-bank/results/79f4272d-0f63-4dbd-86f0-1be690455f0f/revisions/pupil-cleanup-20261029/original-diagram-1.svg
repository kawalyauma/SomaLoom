<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="A square of side 1 metre equals 100 centimetres on each side, containing 100 rows of 100 square centimetres. A separate 10 by 10 sample grid explains the subdivision."><rect width="900" height="540" fill="white"/><g font-family="Arial, sans-serif" fill="#17212b"><text x="450" y="37" font-size="25" font-weight="bold" text-anchor="middle">CONVERTING SQUARE METRES TO SQUARE CENTIMETRES</text><text x="231" y="75" font-size="19" text-anchor="middle">One square metre</text><rect x="100" y="125" width="260" height="260" fill="#f5f8fb" stroke="#202a33" stroke-width="3"/><path d="M100 145 H120 V125" stroke="#202a33" stroke-width="2" fill="none"/><text x="230" y="113" font-size="19" text-anchor="middle">1 m = 100 cm</text><text x="85" y="260" font-size="19" text-anchor="middle" transform="rotate(-90 85 260)">1 m = 100 cm</text><text x="230" y="244" font-size="24" font-weight="bold" text-anchor="middle">1 m²</text><text x="230" y="276" font-size="17" text-anchor="middle">100 cm × 100 cm</text><text x="230" y="413" font-size="17" text-anchor="middle">100 rows × 100 columns</text><path d="M396 260 H478" stroke="#263645" stroke-width="3"/><path d="M463 251 L478 260 L463 269" fill="none" stroke="#263645" stroke-width="3"/><text x="645" y="75" font-size="19" text-anchor="middle">Sample grid: 10 × 10</text><rect x="525" y="125" width="240" height="240" fill="white" stroke="#263645" stroke-width="2"/><path d="M549 125 V365 M573 125 V365 M597 125 V365 M621 125 V365 M645 125 V365 M669 125 V365 M693 125 V365 M717 125 V365 M741 125 V365 M525 149 H765 M525 173 H765 M525 197 H765 M525 221 H765 M525 245 H765 M525 269 H765 M525 293 H765 M525 317 H765 M525 341 H765" stroke="#9caebb" stroke-width="1" fill="none"/><text x="645" y="393" font-size="17" text-anchor="middle">100 sample cells</text><text x="645" y="420" font-size="15" text-anchor="middle">Not the full 1 m² grid</text><path d="M85 447 H815" stroke="#b1bac2" stroke-width="1"/><text x="450" y="483" font-size="25" font-weight="bold" text-anchor="middle">1 m² = 100 × 100 cm² = 10,000 cm²</text><text x="450" y="512" font-size="16" text-anchor="middle">The complete square has 10,000 one-centimetre squares.</text></g></svg>