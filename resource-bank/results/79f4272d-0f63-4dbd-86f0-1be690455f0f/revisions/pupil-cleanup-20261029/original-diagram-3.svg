<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-label="Algebraic rectangle ABCD with length 2x plus 3 centimetres, width x centimetres and perimeter 42 centimetres, followed by the same rectangle with actual dimensions 15 centimetres and 6 centimetres."><rect width="940" height="570" fill="white"/><g font-family="Arial, sans-serif" fill="#1c2833"><text x="470" y="38" text-anchor="middle" font-size="25" font-weight="bold">FINDING UNKNOWN RECTANGLE DIMENSIONS</text><text x="230" y="82" text-anchor="middle" font-size="20" font-weight="bold">Before solving</text><rect x="90" y="151" width="285" height="145" fill="#f7fafc" stroke="#263441" stroke-width="3"/><text x="74" y="147" font-size="22">A</text><text x="380" y="147" font-size="22">B</text><text x="380" y="320" font-size="22">C</text><text x="74" y="320" font-size="22">D</text><text x="233" y="135" text-anchor="middle" font-size="19">(2x + 3) cm</text><text x="233" y="321" text-anchor="middle" font-size="19">(2x + 3) cm</text><text x="65" y="227" text-anchor="middle" font-size="19" transform="rotate(-90 65 227)">x cm</text><text x="400" y="227" text-anchor="middle" font-size="19" transform="rotate(90 400 227)">x cm</text><text x="232" y="365" font-size="20" font-weight="bold" text-anchor="middle">Perimeter = 42 cm</text><path d="M439 229 H506 M492 219 L506 229 L492 239" stroke="#263441" stroke-width="3" fill="none"/><text x="470" y="200" font-size="17" text-anchor="middle">Solve x = 6</text><text x="705" y="82" text-anchor="middle" font-size="20" font-weight="bold">After solving</text><rect x="566" y="151" width="285" height="145" fill="#f7fafc" stroke="#263441" stroke-width="3"/><text x="550" y="147" font-size="22">A</text><text x="857" y="147" font-size="22">B</text><text x="857" y="320" font-size="22">C</text><text x="550" y="320" font-size="22">D</text><text x="709" y="135" font-size="19" text-anchor="middle">15 cm</text><text x="709" y="321" font-size="19" text-anchor="middle">15 cm</text><text x="541" y="227" font-size="19" text-anchor="middle" transform="rotate(-90 541 227)">6 cm</text><text x="875" y="227" font-size="19" text-anchor="middle" transform="rotate(90 875 227)">6 cm</text><text x="709" y="365" font-size="20" font-weight="bold" text-anchor="middle">Perimeter = 42 cm</text><path d="M100 399 H840" stroke="#aeb8c0" stroke-width="1"/><text x="470" y="432" font-size="20" text-anchor="middle">42 = 2[(2x + 3) + x] = 6x + 6</text><text x="470" y="463" font-size="20" text-anchor="middle">6x = 36, so x = 6</text><text x="470" y="494" font-size="20" text-anchor="middle">Length = 2(6) + 3 = 15 cm; width = 6 cm</text><text x="470" y="528" font-size="22" font-weight="bold" text-anchor="middle">Area = 15 × 6 = 90 cm²</text><text x="470" y="552" font-size="15" text-anchor="middle">Diagram not to scale. Both rectangles represent the same dimensions.</text></g></svg>