<svg xmlns="http://www.w3.org/2000/svg" width="690" height="182" viewBox="0 0 690 182"><rect width="690" height="182" rx="12" fill="#f7fafc"/><g font-family="DejaVu Sans,Arial" text-anchor="middle" fill="#1a3347"><rect x="18" y="17" width="312" height="145" rx="12" fill="#e8f3fc" stroke="#45769a"/><text x="174" y="42" font-size="17" font-weight="bold">Mary (Luke 1)</text><text x="174" y="74" font-size="14">Gabriel announces Jesus</text><text x="174" y="103" font-size="14">Mary asks a question</text><text x="174" y="132" font-size="14">Mary accepts the task</text><rect x="360" y="17" width="312" height="145" rx="12" fill="#eef8e9" stroke="#4b8a53"/><text x="516" y="42" font-size="17" font-weight="bold">John (Luke 3)</text><text x="516" y="74" font-size="14">John calls people to repent</text><text x="516" y="103" font-size="14">People are urged to act fairly</text><text x="516" y="132" font-size="14">John points to one greater</text></g></svg>