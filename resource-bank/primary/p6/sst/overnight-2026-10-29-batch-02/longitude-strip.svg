<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="225px" version="1.1" viewBox="0 0 780 225" width="780px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7fafc" height="225" rx="16" stroke="#cad5df" width="780" x="0" y="0" /><text fill="#1f3b5c" font-family="Noto Sans" font-size="17" x="34" y="36">West</text><text fill="#1f3b5c" font-family="Noto Sans" font-size="17" x="707" y="36">East</text><line stroke="#355c83" stroke-width="3" x1="45" x2="735" y1="91" y2="91" /><polygon fill="#355c83" points="735,91 719,83 719,99" /><line stroke="#386a94" stroke-width="2" x1="65" x2="65" y1="74" y2="108" /><text fill="#16334b" font-family="Noto Sans" font-size="17" text-anchor="middle" x="65" y="61">30°W</text><text fill="#1b4b71" font-family="Noto Sans" font-size="17" text-anchor="middle" x="65" y="139">08:00</text><line stroke="#386a94" stroke-width="2" x1="172" x2="172" y1="74" y2="108" /><text fill="#16334b" font-family="Noto Sans" font-size="17" text-anchor="middle" x="172" y="61">15°W</text><text fill="#1b4b71" font-family="Noto Sans" font-size="17" text-anchor="middle" x="172" y="139">09:00</text><line stroke="#386a94" stroke-width="2" x1="279" x2="279" y1="74" y2="108" /><text fill="#16334b" font-family="Noto Sans" font-size="17" text-anchor="middle" x="279" y="61">0°</text><text fill="#1b4b71" font-family="Noto Sans" font-size="17" text-anchor="middle" x="279" y="139">10:00</text><line stroke="#386a94" stroke-width="2" x1="386" x2="386" y1="74" y2="108" /><text fill="#16334b" font-family="Noto Sans" font-size="17" text-anchor="middle" x="386" y="61">15°E</text><text fill="#1b4b71" font-family="Noto Sans" font-size="17" text-anchor="middle" x="386" y="139">11:00</text><line stroke="#386a94" stroke-width="2" x1="493" x2="493" y1="74" y2="108" /><text fill="#16334b" font-family="Noto Sans" font-size="17" text-anchor="middle" x="493" y="61">30°E</text><text fill="#1b4b71" font-family="Noto Sans" font-size="17" text-anchor="middle" x="493" y="139">12:00</text><line stroke="#386a94" stroke-width="2" x1="600" x2="600" y1="74" y2="108" /><text fill="#16334b" font-family="Noto Sans" font-size="17" text-anchor="middle" x="600" y="61">45°E</text><text fill="#1b4b71" font-family="Noto Sans" font-size="17" text-anchor="middle" x="600" y="139">13:00</text><line stroke="#386a94" stroke-width="2" x1="707" x2="707" y1="74" y2="108" /><text fill="#16334b" font-family="Noto Sans" font-size="17" text-anchor="middle" x="707" y="61">60°E</text><text fill="#1b4b71" font-family="Noto Sans" font-size="17" text-anchor="middle" x="707" y="139">14:00</text><text fill="#243746" font-family="Noto Sans" font-size="16" text-anchor="middle" x="390" y="177">If solar time at 0° is 10:00, each 15° east adds about 1 hour.</text><text fill="#7a4551" font-family="Noto Sans" font-size="14" text-anchor="middle" x="390" y="204">Schematic solar time only — NOT official time-zone boundaries.</text></svg>