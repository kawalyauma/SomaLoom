name: Resource bank exchange
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/resource-bank.yml'
      - 'tools/sync_resource_bank.py'
      - 'resource-bank/results/**'
permissions:
  contents: write
  issues: write
  id-token: write
concurrency:
  group: somaloom-resource-bank
  cancel-in-progress: false
jobs:
  exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::482146446766:role/somaloom-resource-bank-github
          aws-region: eu-central-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - run: python tools/sync_resource_bank.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
