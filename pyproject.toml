[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "somaloom-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.38,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "rq>=2.1,<3", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3", "boto3>=1.36,<2"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "fakeredis>=2.28,<3", "jsonschema>=4.23,<5"]
[tool.setuptools.packages.find]
where = ["apps/api", "."]
include = ["app*", "contracts*", "services*"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
